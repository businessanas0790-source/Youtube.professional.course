<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>كورس اليوتيوب الاحترافي - ANAS THEORY</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            text-align: center;
            padding: 30px;
            margin: 0;
        }
        h1 {
            color: #ff0000;
            font-size: 28px;
        }
        .subtitle {
            font-size: 18px;
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 700px;
            margin: 0 auto 30px auto;
            background: #212121;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2);
        }
        .video-box {
            width: 100%;
            height: 350px;
            background: #000;
            border: 2px dashed #ff0000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff5555;
            font-size: 18px;
            border-radius: 8px;
        }
        .btn {
            background-color: #ff0000;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            font-size: 18px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

    <h1>كورس اليوتيوب الاحترافي 🚀</h1>
    <p class="subtitle">تعلم كيف تصبح مشهوراً وتحصد آلاف المشاهدات والمشتركين مجاناً</p>

    <div class="video-container">
        <h2>الحلقة الأولى: الانطلاقة والسر الخفي</h2>
        <div class="video-box">
            قريباً جداً: سيتم تضمين الفيديو هنا!
        </div>
    </div>

    <a href="#" class="btn">اشترك بالقناة ليصلك كل جديد</a>

</body>
    </html>
